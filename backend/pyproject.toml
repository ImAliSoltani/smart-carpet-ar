[project]
name = "farsh-backend"
version = "0.1.0"
description = "Smart carpet shopping system — FastAPI backend (catalog, visual search, AR pipeline)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pgvector>=0.5.0",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# project-local tmp dir: pytest's default creates a symlink under the system
# temp that Windows refuses to manage without elevation
addopts = "--basetemp=.pytest-tmp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
