<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تست AR — فاز ۰</title>
  <script type="module" src="./model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, Tahoma, sans-serif; background: #0f1220; color: #f2f2f7;
           min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; }
    header h1 { font-size: 1rem; }
    header p { font-size: .8rem; color: #a8adc4; margin-top: 4px; line-height: 1.7; }
    model-viewer { flex: 1; width: 100%; min-height: 42dvh; background: #171b30; }
    .modes { display: flex; gap: 8px; padding: 12px 16px; }
    .modes button { flex: 1; padding: 14px 8px; border: 0; border-radius: 14px;
                    font-size: .95rem; font-weight: bold; color: #1a1a2e; }
    #btn-webxr { background: #ffd166; }
    #btn-sv { background: #7ee0a0; }
    .ql { flex: 1; display: flex; align-items: center; gap: 12px; padding: 10px 14px;
          border-radius: 14px; background: #9fd0ff; color: #10233a; text-decoration: none;
          font-size: .95rem; font-weight: bold; }
    .ql img { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; }
    /* Each platform only sees the paths it can actually run. */
    body:not(.ios) #ios-row { display: none; }
    body.ios #android-row { display: none; }
    #log { margin: 0 16px 12px; padding: 10px 12px; background: #171b30; border-radius: 12px;
           font-size: .72rem; line-height: 1.9; color: #cdd2e8; direction: ltr; text-align: left;
           max-height: 22dvh; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    .steps { padding: 0 16px 18px; font-size: .8rem; line-height: 1.9; color: #cdd2e8; }
    .steps b { color: #ffd166; }
    #copy { width: calc(100% - 32px); margin: 0 16px 18px; padding: 12px; border: 0;
            border-radius: 12px; background: #3d4468; color: #fff; font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <h1>🧪 تست AR — فرش واقعی و مقیاس</h1>
    <p>در حال بارگذاری…</p>
  </header>

  <model-viewer id="mv"
    src="assets/carpet.glb"
    ios-src="assets/carpet.usdz"
    alt="فرش افشان ۲۰۰ در ۳۰۰ سانتی‌متر"
    ar
    ar-modes="webxr"
    ar-scale="fixed"
    ar-placement="floor"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1">
  </model-viewer>

  <div class="modes">
    <button id="btn-model">🔁 فرش واقعی / شطرنجی</button>
  </div>
  <div class="modes" id="android-row">
    <button id="btn-webxr">حالت ۱ — داخل مرورگر (WebXR)</button>
    <button id="btn-sv">حالت ۲ — اپ گوگل (Scene Viewer)</button>
  </div>
  <!-- iOS: Apple's native path. An <a rel="ar"> containing an <img> is the
       documented way to open AR Quick Look, and because the tap goes straight
       to Safari there is no JavaScript in the way that could consume the user
       gesture (which is exactly what broke the previous button). -->
  <div class="modes" id="ios-row">
    <a rel="ar" id="ql-link" href="assets/carpet.usdz" class="ql">
      <img src="assets/poster.jpg" alt="فرش افشان" />
      <span>حالت ۳ — دیدن روی زمین (آیفون)</span>
    </a>
  </div>
  <div class="modes">
    <a href="ar.html" style="flex:1; text-decoration:none">
      <button style="width:100%; background:#c9a6ff">حالت ۴ — تجربه‌ی اختصاصی ما ★</button>
    </a>
  </div>

  <div class="steps">
    برای اندازه‌گیری درست: متر را <b>روی زمین</b> بگذار، فرش را طوری بگذار که لبه‌اش روی صفر متر بیفتد،
    بعد گوشی را <b>مستقیم از بالا</b> بگیر و ببین لبه‌ی دور کجای متر است.
  </div>

  <div id="log">در حال بررسی دستگاه…</div>
  <button id="copy">📋 کپی گزارش فنی</button>

  <script type="module">
    const mv = document.getElementById('mv');
    const logBox = document.getElementById('log');
    const lines = [];

    const log = (msg) => {
      lines.push(msg);
      logBox.textContent = lines.join('\n');
    };

    log('UA: ' + navigator.userAgent);

    if (navigator.xr) {
      navigator.xr.isSessionSupported('immersive-ar')
        .then((ok) => log('WebXR immersive-ar supported: ' + ok))
        .catch((err) => log('WebXR check failed: ' + err));
    } else {
      log('navigator.xr: MISSING (no WebXR in this browser)');
    }

    // Chrome froze the UA string, so the real device model only comes from
    // high-entropy client hints.
    if (navigator.userAgentData?.getHighEntropyValues) {
      navigator.userAgentData
        .getHighEntropyValues(['model', 'platformVersion', 'fullVersionList'])
        .then((hints) => log('device: ' + hints.model + ' | Android ' + hints.platformVersion))
        .catch((err) => log('client hints unavailable: ' + err));
    }

    // canActivateAR is only meaningful once the model has loaded and
    // model-viewer has finished resolving which AR mode it can use.
    mv.addEventListener('load', async () => {
      await mv.updateComplete;
      log('model loaded — canActivateAR: ' + mv.canActivateAR);
    });

    mv.addEventListener('ar-status', (event) => log('ar-status: ' + event.detail.status));
    mv.addEventListener('error', (event) => log('ERROR: ' + JSON.stringify(event.detail)));

    const activate = async (modes, label) => {
      log('--- requesting ' + label + ' (ar-modes="' + modes + '") ---');
      mv.setAttribute('ar-modes', modes);
      // model-viewer resolves the AR mode during its update cycle; calling
      // activateAR() in the same tick would launch the previously resolved mode.
      await mv.updateComplete;
      await new Promise((resolve) => requestAnimationFrame(resolve));
      log('resolved canActivateAR: ' + mv.canActivateAR);
      try {
        await mv.activateAR();
      } catch (err) {
        log('activateAR failed: ' + err);
      }
    };

    document.getElementById('btn-webxr')
      .addEventListener('click', () => activate('webxr', 'WebXR'));
    document.getElementById('btn-sv')
      .addEventListener('click', () => activate('scene-viewer', 'Scene Viewer'));
    // iOS: no JS activation path at all — see the markup comment above.
    const isIOS =
      /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    document.body.classList.toggle('ios', isIOS);
    log('platform: ' + (isIOS ? 'iOS (Quick Look)' : 'non-iOS (WebXR / Scene Viewer)'));
    log('rel="ar" supported: ' + (document.createElement('a').relList?.supports('ar') ?? 'unknown'));

    // The real carpet is the product; the checkerboard is the measuring stick.
    const MODELS = {
      real: {
        src: 'assets/carpet.glb',
        ios: 'assets/carpet.usdz',
        note: 'فرش افشان — ۲۰۰ × ۳۰۰ سانتی‌متر (ساخته‌شده از یک عکس معمولی)',
      },
      calib: {
        src: 'assets/calib-carpet.glb',
        ios: '',
        note: 'فرش کالیبراسیون ۱٫۰۰ × ۱٫۵۰ متر — هر خانه دقیقاً ۱۰ سانتی‌متر',
      },
    };
    let current = 'real';
    const noteBox = document.querySelector('header p');
    noteBox.textContent = MODELS.real.note;

    document.getElementById('btn-model').addEventListener('click', () => {
      current = current === 'real' ? 'calib' : 'real';
      const model = MODELS[current];
      mv.src = model.src;
      const qlRow = document.getElementById('ios-row');
      if (model.ios) {
        mv.setAttribute('ios-src', model.ios);
        document.getElementById('ql-link').href = model.ios;
        qlRow.style.visibility = '';
      } else {
        mv.removeAttribute('ios-src');
        qlRow.style.visibility = 'hidden'; // no iOS asset for this model
      }
      noteBox.textContent = model.note;
      log('--- switched model: ' + model.src + ' ---');
    });

    document.getElementById('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(lines.join('\n'));
        document.getElementById('copy').textContent = '✅ کپی شد — برای من بفرست';
      } catch {
        document.getElementById('copy').textContent = 'دستی انتخاب و کپی کن ↑';
      }
    });
  </script>
</body>
</html>
